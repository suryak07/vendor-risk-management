<!DOCTYPE html>
<html>
<head>
    <title>Login - RiskGuard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            height: 100vh;
            margin: 0;
        }

        .left-panel {
            background: linear-gradient(135deg, #111827, #1f2937);
            color: white;
            padding: 60px;
        }

        .brand-title {
            font-size: 32px;
            font-weight: bold;
        }

        .brand-sub {
            margin-top: 20px;
            font-size: 16px;
            opacity: 0.8;
        }

        .login-box {
            width: 350px;
        }
    </style>
</head>
<body>

<div class="container-fluid h-100">
    <div class="row h-100">

        <!-- Left Branding Panel -->
        <div class="col-md-6 d-flex align-items-center left-panel">
            <div>
                <div class="brand-title">🔐 RiskGuard</div>
                <div class="brand-sub">
                    Third Party Vendor Risk Management Platform  
                    with Real-time Risk Analytics & Security Insights.
                </div>
            </div>
        </div>

        <!-- Right Login Panel -->
        <div class="col-md-6 d-flex align-items-center justify-content-center bg-light">

            <div class="card shadow p-4 login-box">
                <h4 class="text-center mb-3">Welcome Back</h4>

                {% if error %}
                    <div class="alert alert-danger text-center">
                        {{ error }}
                    </div>
                {% endif %}

                <form method="POST">
                    <input type="text" name="username" class="form-control mb-3" placeholder="Username" required>
                    <input type="password" name="password" class="form-control mb-3" placeholder="Password" required>

                    <button class="btn btn-dark w-100">Login</button>
                </form>

                <div class="text-center mt-3">
                    <a href="/register">Create Account</a>
                </div>
            </div>

        </div>

    </div>
</div>

</body>
</html>
